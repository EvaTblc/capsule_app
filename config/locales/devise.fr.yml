# Traduction française des messages de Devise.
# Ton : formulations NEUTRES (ni « tu » ni « vous »), car ces messages s'affichent aussi bien sur les
# pages publiques (vouvoiement) que dans l'appli (tutoiement). Pas de forme genrée non plus.
# Sans ce fichier, la locale par défaut étant :fr, Devise affichait « Translation missing: fr.devise… »

fr:
  devise:
    confirmations:
      confirmed: "Adresse e-mail confirmée."
