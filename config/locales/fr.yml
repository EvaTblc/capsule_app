              greater_than_or_equal_to: "L'année de sortie doit être une année à 4 chiffres (par exemple 2007)."
              less_than_or_equal_to: "L'année de sortie doit être une année à 4 chiffres (par exemple 2007)."
        figurine_detail:
          attributes:
            edition:
              inclusion: "Choisis une édition dans la liste."
            condition_box:
              inclusion: "Choisis l'état de la boîte dans la liste."
        wish:
          attributes:
            title:
              blank: "Donne un titre à ton souhait."
            max_price:
              not_a_number: "Le prix maximum doit être un nombre, par exemple 20 ou 12.50."
              greater_than: "Le prix maximum doit être supérieur à 0 €."
            product_id:
              taken: "Ce jeu est déjà dans les souhaits de cette collection."
            collection:
              invalid: "Cette collection n'est pas accessible."
        event:
          attributes:
            title:
              blank: "Le titre ne peut pas être vide"
        user:
          attributes:
            base:
              google_unverified: "Google n'a pas vérifié l'adresse e-mail de ce compte : connexion impossible."
              google_other_account: "Cette adresse est déjà reliée à un autre compte Google. Connectez-vous avec ce compte-là, ou avec votre mot de passe."
            # Phrases complètes et neutres (inscription en « vous », page Mon compte en « tu ») :
            # le formulaire n'affiche que le message, sans le nom du champ
            email:
              blank: "L'adresse e-mail est obligatoire."
              invalid: "Cette adresse e-mail n'est pas valide."
              taken: "Cette adresse e-mail est déjà utilisée."
            password:
              blank: "Le mot de passe est obligatoire."
              too_short: "Le mot de passe est trop court (%{count} caractères minimum)."
              too_long: "Le mot de passe est trop long (%{count} caractères maximum)."
