      models:
        item:
          attributes:
            base:
              type_unavailable: "Ce type d'item n'est pas disponible pour le moment."
            title:
              blank: "Le titre ne peut pas être vide"
            condition:
              blank: "L'état ne peut pas être vide"
              inclusion: "Cet état n'est pas valide"
        collection:
          attributes:
            title:
              blank: "Le titre ne peut pas être vide"
            category:
              inclusion: "Choisis une catégorie."
              unavailable: "Cette catégorie n'est pas disponible pour le moment."
        # Détails des items : phrases complètes, affichées sans le nom du champ (ItemSaver#collect_errors)
        video_game_detail:
          attributes:
            platform:
              inclusion: "Cette plateforme n'est pas dans la liste : choisis-en une parmi les boutons ou la liste."
            release_date:
              not_a_number: "L'année de sortie doit être une année à 4 chiffres (par exemple 2007)."
