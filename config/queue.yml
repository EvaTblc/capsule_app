default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # Une requête par seconde suffit pour des tâches de fond (0.1 = 10 requêtes/s en continu sur la base)
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
